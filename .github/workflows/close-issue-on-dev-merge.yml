name: Close linked issues on dev merge

# GitHub 標準の closing keyword（Closes #12 等）はデフォルトブランチ（main）への
# マージでしか発火しない。この repo はフィーチャー PR の base が dev のため、
# dev へのマージ時に PR 本文のキーワードを解釈して Issue を閉じる。

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close-linked-issues:
    # マージされずに閉じた PR では何もしない
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // close/fix/resolve 系キーワード + #<番号>。GitHub 本体の解釈に合わせる
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;
            const numbers = [...new Set(
              [...body.matchAll(pattern)].map((m) => Number(m[1]))
            )];

            if (numbers.length === 0) {
              core.info('closing keyword が見つかりませんでした。');
              return;
            }

            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number,
                });

                // #<番号> は PR も指しうるため、Issue 以外は無視する
                if (issue.pull_request) {
                  core.info(`#${issue_number} は PR のためスキップします。`);
                  continue;
                }
                if (issue.state === 'closed') {
                  core.info(`#${issue_number} は既に closed です。`);
                  continue;
                }

                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number,
                  body: `#${pr.number} が \`dev\` にマージされたため、この Issue を close します。`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`#${issue_number} を close しました。`);
              } catch (error) {
                // 1件の失敗で他の Issue の処理を止めない
                core.warning(`#${issue_number} の close に失敗しました: ${error.message}`);
              }
            }
